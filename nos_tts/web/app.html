<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voces Nós</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --txt: #1d2026; --sub: #5f6672; --borde: #dde1e6;
    --pri: #0b74c4; --pri-txt: #fff; --ok: #2e7d32; --err: #c62828; --barra: #e3e7ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b1f25; --txt: #e6e8eb; --sub: #9aa3ae; --borde: #2c323a;
      --pri: #4ea3e6; --pri-txt: #0b0d10; --ok: #66bb6a; --err: #ef5350; --barra: #2c323a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4em; margin: 4px 0 2px; }
  h2 { font-size: 1.1em; margin: 0 0 10px; }
  .sub { color: var(--sub); font-size: .9em; }
  section { background: var(--card); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; margin: 14px 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  th { color: var(--sub); font-weight: 500; font-size: .85em; }
  tr:last-child td { border-bottom: 0; }
  button, .btn { font: inherit; font-weight: 500; border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; background: var(--pri); color: var(--pri-txt); }
  button.sec { background: transparent; color: var(--pri); border: 1px solid var(--borde); }
  button.peligro { background: transparent; color: var(--err); border: 1px solid var(--borde); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--txt); background: var(--bg); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 9px; width: 100%; }
  textarea { font-family: ui-monospace, Consolas, monospace; font-size: .9em; min-height: 140px; resize: vertical; }
  label { display: block; font-size: .85em; color: var(--sub); margin: 8px 0 3px; }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .fila > * { flex: 1 1 180px; }
  .fila > button { flex: 0 0 auto; }
  .chip { display: inline-block; font-size: .8em; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--borde); color: var(--sub); }
  .chip.ok { color: var(--ok); border-color: var(--ok); }
  .chip.err { color: var(--err); border-color: var(--err); }
  .acciones { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .barra { height: 8px; background: var(--barra); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .barra > div { height: 100%; background: var(--pri); width: 0; transition: width .4s; }
  .tarea { padding: 8px 0; border-bottom: 1px solid var(--borde); }
  .tarea:last-child { border-bottom: 0; }
  .msg { font-size: .9em; margin-top: 8px; min-height: 1.2em; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .cat { border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  details summary { cursor: pointer; color: var(--pri); margin-top: 6px; }
  a { color: var(--pri); }
  .caja { background: var(--card); border: 1px solid var(--borde); border-radius: 12px; margin: 14px 0; overflow: hidden; }
  .tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--borde); overflow-x: auto; }
  .tabs button { background: transparent; color: var(--sub); border-radius: 0; border-bottom: 2px solid transparent; padding: 12px 14px 10px; white-space: nowrap; }
  .tabs button:hover { color: var(--txt); }
  .tabs button[aria-selected="true"] { color: var(--pri); border-bottom-color: var(--pri); }
  .caja section { background: transparent; border: 0; border-radius: 0; margin: 0; }
  .caja section + section { border-top: 1px solid var(--borde); }
  .punto { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pri); vertical-align: middle; }
  [hidden] { display: none !important; }
  .cabecera { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  select.motor { width: auto; padding: 4px 8px; font-size: .9em; }
  .cabecera select { width: auto; padding: 4px 8px; font-size: .9em; }
  @media (max-width: 600px) { .ocultar-movil { display: none; } .tabs button { padding: 9px 10px; } }
</style>
</head>
<body>
<main>
  <div class="cabecera">
    <div>
      <h1>Voces Nós</h1>
      <div class="sub"><span data-i18n="subtitulo"></span> · <span id="version"></span> · <span id="libre"></span></div>
    </div>
    <select id="idioma" aria-label="Idioma / Language">
      <option value="gl">Galego</option>
      <option value="es">Castellano</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="caja">
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="voces" data-i18n="tab_voces"></button>
    <button role="tab" data-tab="instalar"><span data-i18n="tab_instalar"></span> <span class="punto" id="punto-instalar" hidden></span></button>
    <button role="tab" data-tab="probar" data-i18n="tab_probar"></button>
    <button role="tab" data-tab="config" data-i18n="tab_config"></button>
  </nav>

  <div class="panel" id="tab-voces">
  <section>
    <h2 data-i18n="voces_instaladas"></h2>
    <table>
      <thead><tr><th data-i18n="col_voz"></th><th data-i18n="col_idioma"></th><th class="ocultar-movil" data-i18n="col_tamano"></th><th data-i18n="col_estado"></th><th data-i18n="col_motor"></th><th></th></tr></thead>
      <tbody id="voces"><tr><td colspan="6" class="sub" data-i18n="cargando"></td></tr></tbody>
    </table>
    <div class="msg ok" id="v-msg"></div>
    <div class="msg sub" data-i18n-html="nota_voces"></div>
  </section>

  <section>
    <h2 data-i18n="idiomas"></h2>
    <label style="display:flex;gap:8px;align-items:center;cursor:pointer">
      <input type="checkbox" id="idioma-ha" style="width:auto"> <span data-i18n="idioma_ha"></span>
    </label>
    <div class="sub" id="idioma-ha-ayuda" style="margin-top:6px"></div>
  </section>

  </div>

  <div class="panel" id="tab-instalar" hidden>
  <section>
    <h2 data-i18n="instalar_hf"></h2>
    <div class="catalogo" id="catalogo"></div>
    <details>
      <summary data-i18n="otro_repo"></summary>
      <div class="fila">
        <div><label for="repo" data-i18n="repo"></label><input id="repo" placeholder="proxectonos/Nos_TTS-brais-vits-graphemes"></div>
        <div><label for="nombre" data-i18n="nombre_voz"></label><input id="nombre" placeholder="brais"></div>
        <button id="instalar-otro" data-i18n="instalar"></button>
      </div>
    </details>
    <label for="token" data-i18n="token"></label>
    <input id="token" type="password" autocomplete="off" placeholder="hf_…">
    <div class="sub" style="margin-top:6px" data-i18n-html="token_ayuda"></div>
    <div id="tareas"></div>
  </section>

  <section>
    <h2 data-i18n="subir_voz"></h2>
    <div class="sub" data-i18n-html="subir_ayuda"></div>
    <div class="fila">
      <div><label for="s-nombre" data-i18n="nombre"></label><input id="s-nombre" placeholder="minha_voz"></div>
      <div><label for="s-desc" data-i18n="descripcion"></label><input id="s-desc" placeholder="Minha voz (muller)"></div>
    </div>
    <div class="fila">
      <div><label for="s-pth" data-i18n="modelo"></label><input id="s-pth" type="file" accept=".pth"></div>
      <div><label for="s-cfg">config.json</label><input id="s-cfg" type="file" accept=".json"></div>
      <button id="subir" data-i18n="subir"></button>
    </div>
    <div class="barra" id="s-barra" hidden><div></div></div>
    <div class="msg" id="s-msg"></div>
  </section>

  </div>

  <div class="panel" id="tab-probar" hidden>
  <section>
    <h2 data-i18n="tab_probar"></h2>
    <div class="fila">
      <div style="flex:0 1 200px"><label for="p-voz" data-i18n="col_voz"></label><select id="p-voz"></select></div>
      <div style="flex:3 1 300px"><label for="p-texto" data-i18n="texto"></label><input id="p-texto" value="Benvidos. Isto é unha proba da voz en galego."></div>
      <button id="probar" data-i18n="escuchar"></button>
    </div>
    <div class="msg" id="p-msg"></div>
  </section>

  </div>

  <div class="panel" id="tab-config" hidden>
  <section>
    <h2 data-i18n="diccionario"></h2>
    <div class="sub" data-i18n-html="diccionario_ayuda"></div>
    <textarea id="t-pronuncia" spellcheck="false"></textarea>
    <div class="fila" style="margin-top:8px"><div class="msg" id="m-pronuncia"></div><button data-guardar="pronuncia" data-i18n="guardar"></button></div>
  </section>

  <section>
    <h2 data-i18n="ajustes"></h2>
    <div class="sub" data-i18n-html="ajustes_ayuda"></div>
    <textarea id="t-ajustes" spellcheck="false"></textarea>
    <div class="fila" style="margin-top:8px"><div class="msg" id="m-ajustes"></div><button data-guardar="ajustes" data-i18n="guardar"></button></div>
    <div class="sub" data-i18n-html="ajustes_defecto"></div>
  </section>
  </div>
  </div>
</main>

// Idioma: el elegido aquí > el de Home Assistant (misma web, localStorage "selectedLanguage") > el del navegador.
function idiomaInicial() {
  const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const candidatos = [leer("nos_tts_idioma")];
  try { candidatos.push(JSON.parse(leer("selectedLanguage") || "null")); } catch {}
  candidatos.push(...(navigator.languages || [navigator.language]));
  for (const c of candidatos) {
    const l = String(c || "").toLowerCase().slice(0, 2);
    if (I18N[l]) return l;
  }
  return "en";
}
let idioma = idiomaInicial();
const fmt = (s, p = {}) => String(s).replace(/\{(\w+)\}/g, (_, k) => (p[k] ?? `{${k}}`));
const t = (k, p) => fmt(I18N[idioma][k] ?? I18N.en[k] ?? k, p);
const tm = (m) => (m && m.c ? fmt(I18N[idioma].e[m.c] ?? I18N.en.e[m.c] ?? m.c, m.p || {}) : "");

function traducir() {
  document.documentElement.lang = idioma;
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  $("#idioma").value = idioma;
  if (estado) pintar();
}

// ---------- Página ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mb = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : (n / 1e6).toFixed(0) + " MB";
let estado = null, sondeo = null, audio = null;

async function api(metodo, ruta, cuerpo, tipo = "application/json") {
  // X-Nos-Web: así el servidor sabe que es la página actual (ver api_estado en server.py).
  const op = { method: metodo, headers: { "X-Nos-Web": "2" } };
  if (cuerpo !== undefined) {
    op.body = tipo === "application/json" ? JSON.stringify(cuerpo) : cuerpo;
    op.headers["Content-Type"] = tipo;
  }
  const r = await fetch(ruta, op);
  if (!r.ok) throw new Error(textoError(r.status, await r.text()));
  return r;
}

// El servidor manda {"error": {"c": código, "p": parámetros}}; si no, se muestra el texto tal cual.
function textoError(status, cuerpo) {
  try {
    const j = JSON.parse(cuerpo);
    if (j && j.error) return tm(j.error);
  } catch {}
  return cuerpo || "HTTP " + status;
}

// Nombre de una voz del catálogo en el idioma elegido: "Celtia (muller / mujer / female)".
function descripcionVoz(nombre, guardada) {
  const c = estado && estado.catalogo.find((x) => x.nombre === nombre);
  if (c && c.genero) return `${nombre.charAt(0).toUpperCase() + nombre.slice(1)} (${t("genero_" + c.genero)})`;
  return guardada;
}

// "gl" -> "Gallego" / "Galego" / "Galician", en el idioma de la página.
function nombreIdioma(codigo) {
  try {
    const n = new Intl.DisplayNames([idioma], { type: "language" }).of(String(codigo).replace("_", "-"));
    return n ? n.charAt(0).toUpperCase() + n.slice(1) : codigo;
  } catch {
    return codigo;
  }
}

function pintar() {
  const e = estado;
  $("#version").textContent = "v" + e.version;
  $("#libre").textContent = t("libres", { x: mb(e.libre) });
  $("#voces").innerHTML = e.voces.length ? e.voces.map((v) => `
    <tr>
      <td><b>${esc(v.nombre)}</b>${v.defecto ? ` <span class="chip">${t("por_defecto")}</span>` : ""}<div class="sub">${esc(descripcionVoz(v.nombre, v.descripcion))}</div></td>
      <td>${esc(nombreIdioma(v.idioma))}<div class="sub"><code>${esc(v.idioma)}</code></div></td>
      <td class="ocultar-movil">${mb(v.tamano)}</td>
      <td>${v.error ? `<span class="chip err" title="${esc(v.error)}">${t("error")}</span>` : v.cargada ? `<span class="chip ok">${t("activa")}</span>` : `<span class="chip">${t("sin_cargar")}</span>`}</td>
      <td>${v.cargada ? `<select class="motor" data-motor="${esc(v.nombre)}" title="${t("motor_ayuda")}">
          <option value="torch" ${v.motor === "torch" ? "selected" : ""}>Torch</option>
          <option value="onnx" ${v.motor === "onnx" ? "selected" : ""}>${t("motor_onnx")}</option>
        </select>` : `<span class="sub">${esc(v.motor)}</span>`}</td>
      <td><div class="acciones">
        ${!v.defecto && v.cargada ? `<button class="sec" data-defecto="${esc(v.nombre)}">${t("usar_defecto")}</button>` : ""}
        <button class="sec" data-probar="${esc(v.nombre)}" ${v.cargada ? "" : "disabled"}>${t("probar")}</button>
        <button class="peligro" data-borrar="${esc(v.nombre)}">${t("borrar")}</button>
      </div></td>
    </tr>`).join("") : `<tr><td colspan="6" class="sub">${t("sin_voces")}</td></tr>`;
  $("#punto-instalar").hidden = !e.ocupado.length;

  $("#idioma-ha").checked = !!e.idioma_ha;
  const declarados = [...new Set(e.voces.flatMap((v) => v.idiomas || []))];
  $("#idioma-ha-ayuda").innerHTML = t("idioma_ha_ayuda", {
    x: esc(declarados.join(", ") || "—"), h: `<code>${esc(e.idioma_sistema || t("sin_idioma_ha"))}</code>` });

  const instaladas = new Set(e.voces.map((v) => v.nombre));
  $("#catalogo").innerHTML = e.catalogo.map((c) => `
    <div class="cat">
      <div><b>${esc(descripcionVoz(c.nombre, c.descripcion))}</b><div class="sub">${c.restringido ? t("restringido") : t("libre")}</div></div>
      <button data-instalar="${esc(c.repo)}" data-nombre="${esc(c.nombre)}" ${e.ocupado.includes(c.nombre) ? "disabled" : ""}>
        ${e.ocupado.includes(c.nombre) ? t("instalando") : instaladas.has(c.nombre) ? t("reinstalar") : t("instalar")}</button>
    </div>`).join("");

  $("#tareas").innerHTML = e.tareas.map((ta) => {
    const pct = ta.total ? Math.round(100 * ta.hecho / ta.total) : 0;
    const cls = ta.estado === "error" ? "err" : ta.estado === "ok" ? "ok" : "";
    return `<div class="tarea"><b>${esc(ta.nombre)}</b> <span class="sub">${esc(ta.repo)}</span>
      <div class="msg ${cls}">${esc(tm(ta.msg) || ta.mensaje || "")}${ta.estado === "en curso" && ta.total ? ` · ${mb(ta.hecho)} ${t("de")} ${mb(ta.total)} (${pct}%)` : ""}</div>
      ${ta.estado === "en curso" ? `<div class="barra"><div style="width:${pct}%"></div></div>` : ""}</div>`;
  }).join("");

  const sel = $("#p-voz"), antes = sel.value;
  sel.innerHTML = e.voces.filter((v) => v.cargada).map((v) => `<option value="${esc(v.nombre)}">${esc(v.nombre)}</option>`).join("");
  if ([...sel.options].some((o) => o.value === antes)) sel.value = antes;
}

function aviso(texto) {
  const m = $("#v-msg");
  m.textContent = texto;
  clearTimeout(aviso.t);
  aviso.t = setTimeout(() => (m.textContent = ""), 6000);
}

async function refrescar() {
  try {
    estado = await (await api("GET", "api/estado")).json();
    pintar();
    clearTimeout(sondeo);
    if (estado.ocupado.length) sondeo = setTimeout(refrescar, 1000);
  } catch (err) {
    $("#voces").innerHTML = `<tr><td colspan="6" class="msg err">${esc(err.message)}</td></tr>`;
  }
}

async function instalar(repo, nombre) {
  try {
    await api("POST", "api/descargar", { repo, nombre, token: $("#token").value });
  } catch (err) {
    alert(err.message);
  }
  refrescar();
}

document.addEventListener("change", async (ev) => {
  if (ev.target.id === "idioma-ha") {
    const c = ev.target;
    c.disabled = true;
    try {
      const r = await (await api("POST", "api/idioma_ha", { activo: c.checked })).json();
      aviso(t("aviso_idiomas") + (r.wyoming_recargado ? t("wyoming_ok") : t("wyoming_mal")));
    } catch (err) {
      aviso(err.message);
    }
    c.disabled = false;
    refrescar();
    return;
  }
  const s = ev.target.closest("select[data-motor]");
  if (!s) return;
  s.disabled = true;
  try {
    const r = await (await api("POST", "api/motor", { nombre: s.dataset.motor, motor: s.value })).json();
    aviso(t("aviso_motor", { v: s.dataset.motor, x: r.motor === "onnx" ? "ONNX" : "Torch" }) + (r.cache_vaciada ? t("cache_vaciada") : ""));
    $("#t-ajustes").value = await (await api("GET", "api/texto/ajustes")).text();
  } catch (err) { alert(err.message); }
  refrescar();
});

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.tab) return mostrar(b.dataset.tab);
  if (b.dataset.instalar) return instalar(b.dataset.instalar, b.dataset.nombre);
  if (b.dataset.defecto) {
    try {
      const r = await (await api("POST", "api/defecto", { nombre: b.dataset.defecto })).json();
      aviso(t("aviso_defecto", { x: r.defecto }) + (r.cache_vaciada ? t("cache_vaciada") : ""));
      $("#t-ajustes").value = await (await api("GET", "api/texto/ajustes")).text();
    } catch (err) { alert(err.message); }
    return refrescar();
  }
  if (b.dataset.borrar) {
    if (!confirm(t("confirmar_borrar", { x: b.dataset.borrar }))) return;
    try { await api("DELETE", "api/voces/" + encodeURIComponent(b.dataset.borrar)); } catch (err) { alert(err.message); }
    return refrescar();
  }
  if (b.dataset.probar) {
    mostrar("probar");
    $("#p-voz").value = b.dataset.probar;
    return probar();
  }
  if (b.dataset.guardar) {
    const cual = b.dataset.guardar, m = $("#m-" + cual);
    try {
      const r = await (await api("PUT", "api/texto/" + cual, $("#t-" + cual).value, "text/plain; charset=utf-8")).json();
      m.className = "msg ok";
      m.textContent = t("guardado") + (r.cache_vaciada ? t("guardado_cache") : ".");
      refrescar();
    } catch (err) { m.className = "msg err"; m.textContent = err.message; }
  }
});

$("#idioma").addEventListener("change", () => {
  idioma = $("#idioma").value;
  try { localStorage.setItem("nos_tts_idioma", idioma); } catch {}
  traducir();
});

$("#instalar-otro").addEventListener("click", () => {
  const repo = $("#repo").value.trim();
  if (repo) instalar(repo, $("#nombre").value.trim());
});

async function probar() {
  const m = $("#p-msg"), b = $("#probar");
  if (audio) { audio.pause(); audio = null; }
  if (!$("#p-voz").value) { m.className = "msg err"; m.textContent = t("sin_voz_activa"); return; }
  b.disabled = true; m.className = "msg sub"; m.textContent = t("generando");
  const t0 = performance.now();
  try {
    const r = await api("POST", "api/probar", { voz: $("#p-voz").value, texto: $("#p-texto").value });
    const url = URL.createObjectURL(await r.blob());
    audio = new Audio(url);
    await audio.play();
    m.className = "msg ok";
    m.innerHTML = `${esc(t("generado", { x: ((performance.now() - t0) / 1000).toFixed(1) }))} · <a href="${url}" download="nos_${esc($("#p-voz").value)}.wav">${esc(t("descargar"))}</a>`;
  } catch (err) { m.className = "msg err"; m.textContent = err.message; }
  b.disabled = false;
}
$("#probar").addEventListener("click", probar);

$("#subir").addEventListener("click", () => {
  const m = $("#s-msg"), barra = $("#s-barra"), pth = $("#s-pth").files[0], cfg = $("#s-cfg").files[0];
  const nombre = $("#s-nombre").value.trim();
  if (!nombre || !pth || !cfg) { m.className = "msg err"; m.textContent = t("subir_faltan"); return; }
  const fd = new FormData();
  fd.append("nombre", nombre);
  fd.append("descripcion", $("#s-desc").value.trim());
  fd.append("config", cfg);
  fd.append("modelo", pth);
  const x = new XMLHttpRequest();
  x.open("POST", "api/subir");
  barra.hidden = false; $("#subir").disabled = true; m.className = "msg sub"; m.textContent = t("subiendo");
  x.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    barra.firstElementChild.style.width = (100 * e.loaded / e.total) + "%";
    m.textContent = `${t("subiendo")} ${mb(e.loaded)} ${t("de")} ${mb(e.total)}` + (e.loaded === e.total ? t("cargando_voz") : "");
  };
  x.onload = () => {
    $("#subir").disabled = false; barra.hidden = true;
    if (x.status === 200) { m.className = "msg ok"; m.textContent = t("voz_instalada"); }
    else { m.className = "msg err"; m.textContent = textoError(x.status, x.responseText); }
    refrescar();
  };
  x.onerror = () => {
    $("#subir").disabled = false; barra.hidden = true;
    m.className = "msg err";
    m.textContent = t("subida_cortada");
  };
  x.send(fd);
});

function mostrar(tab) {
  if (!document.getElementById("tab-" + tab)) tab = "voces";
  for (const p of document.querySelectorAll(".panel")) p.hidden = p.id !== "tab-" + tab;
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.tab === tab);
  if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
}
window.addEventListener("hashchange", () => mostrar(location.hash.slice(1)));
traducir();
mostrar(location.hash.slice(1));

(async () => {
  for (const cual of ["pronuncia", "ajustes"]) {
    try { $("#t-" + cual).value = await (await api("GET", "api/texto/" + cual)).text(); } catch {}
  }
  refrescar();
})();
</script>
